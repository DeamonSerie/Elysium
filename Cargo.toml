[workspace]
members = [
    "node",
    "runtime/elysium-runtime",
    "pallets/pallet-elysium-assets-registry",
    "pallets/pallet-liquidity-mining",
    "pallets/pallet-beta",
    "pallets/pallet-zk-verifier",
    "primitives",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Elysium Contributors"]
edition = "2021"
license = "MIT"
repository = "https://example.com/elysium"

[workspace.dependencies]
# local
elysium-primitives = { path = "primitives", default-features = false }
pallet-elysium-assets-registry = { path = "pallets/pallet-elysium-assets-registry", default-features = false }
pallet-liquidity-mining = { path = "pallets/pallet-liquidity-mining", default-features = false }
pallet-beta = { path = "pallets/pallet-beta", default-features = false }
pallet-zk-verifier = { path = "pallets/pallet-zk-verifier", default-features = false }
elysium-runtime = { path = "runtime/elysium-runtime", default-features = false }

# codec / scale
codec = { package = "parity-scale-codec", version = "3.7.4", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
log = { version = "0.4.22", default-features = false }

# FRAME / Substrate (aligned to cached registry versions)
frame-support = { version = "49.0.1", default-features = false }
frame-system = { version = "49.0.0", default-features = false }
frame-executive = { version = "49.0.0", default-features = false }
frame-benchmarking = { version = "50.0.0", default-features = false }
frame-try-runtime = { version = "0.55.0", default-features = false }
frame-system-benchmarking = { version = "50.0.0", default-features = false }
frame-system-rpc-runtime-api = { version = "44.0.0", default-features = false }

pallet-aura = { version = "49.0.0", default-features = false }
pallet-grandpa = { version = "50.0.0", default-features = false }
pallet-timestamp = { version = "49.0.0", default-features = false }
pallet-balances = { version = "51.0.2", default-features = false }
pallet-assets = { version = "54.0.1", default-features = false }
pallet-transaction-payment = { version = "50.0.0", default-features = false }
pallet-transaction-payment-rpc-runtime-api = { version = "50.0.0", default-features = false }
pallet-sudo = { version = "50.0.0", default-features = false }
pallet-utility = { version = "50.0.0", default-features = false }
pallet-multisig = { version = "50.0.0", default-features = false }
pallet-treasury = { version = "49.0.0", default-features = false }
pallet-session = { version = "50.0.0", default-features = false }
pallet-authorship = { version = "49.0.0", default-features = false }

pallet-staking = { version = "50.0.0", default-features = false }
pallet-offences = { version = "48.0.0", default-features = false }
pallet-bags-list = { version = "49.0.0", default-features = false }
pallet-election-provider-multi-phase = { version = "51.0.0", default-features = false }
frame-election-provider-support = { version = "49.0.0", default-features = false }
pallet-session-benchmarking = { version = "50.0.0", default-features = false }
sp-npos-elections = { version = "44.0.0", default-features = false }
pallet-contracts = { version = "51.0.0", default-features = false }
pallet-contracts-uapi = { version = "14.0.0", default-features = false }
pallet-insecure-randomness-collective-flip = { version = "38.0.0", default-features = false }

sp-api = { version = "44.0.0", default-features = false }
sp-block-builder = { version = "44.0.0", default-features = false }
sp-consensus-aura = { version = "0.50.0", default-features = false }
sp-consensus-grandpa = { version = "31.0.0", default-features = false }
sp-core = { version = "43.0.0", default-features = false }
sp-inherents = { version = "44.0.0", default-features = false }
sp-offchain = { version = "44.0.0", default-features = false }
sp-runtime = { version = "49.0.0", default-features = false }
sp-session = { version = "46.0.0", default-features = false }
sp-staking = { version = "46.0.0", default-features = false }
sp-std = { version = "14.0.0", default-features = false }
sp-storage = { version = "25.0.0", default-features = false }
sp-transaction-pool = { version = "44.0.0", default-features = false }
sp-version = { version = "47.0.0", default-features = false }
sp-genesis-builder = { version = "0.25.0", default-features = false }
sp-io = { version = "49.0.0", default-features = false }
sp-keyring = { version = "49.0.0", default-features = false }

# node
sc-cli = { version = "0.51.0", default-features = false }
sc-executor = { version = "0.42.0", default-features = false }
sc-network = { version = "0.49.1", default-features = false }
sc-service = { version = "0.50.0", default-features = false }
sc-telemetry = { version = "34.0.0", default-features = false }
sc-transaction-pool = { version = "39.0.0", default-features = false }
sc-transaction-pool-api = { version = "39.0.0", default-features = false }
sc-offchain = { version = "44.0.0", default-features = false }
sc-consensus-aura = { version = "0.49.0", default-features = false }
sc-consensus = { version = "0.48.0", default-features = false }
sc-consensus-grandpa = { version = "0.34.0", default-features = false }
sc-client-api = { version = "48.0.0", default-features = false }
sc-rpc-api = { version = "0.48.0", default-features = false }
sc-basic-authorship = { version = "0.49.0", default-features = false }

sp-timestamp = { version = "44.0.0", default-features = false }
sp-blockchain = { version = "47.0.0", default-features = false }

substrate-frame-rpc-system = { version = "43.0.0", default-features = false }
pallet-transaction-payment-rpc = { version = "43.0.0", default-features = false }
substrate-build-script-utils = { version = "11.0.0" }

jsonrpsee = { version = "0.24.3", features = ["server"] }
futures = "0.3.31"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
panic = "unwind"


[patch.crates-io]

[package]
name = "elysium-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true, features = ["alloc"] }

# primitives & pallets
elysium-primitives = { workspace = true }
pallet-elysium-assets-registry = { workspace = true }
pallet-liquidity-mining = { workspace = true }
pallet-beta = { workspace = true }
pallet-zk-verifier = { workspace = true }

# frame
frame-support = { workspace = true }
frame-system = { workspace = true }
frame-executive = { workspace = true }
frame-try-runtime = { workspace = true, optional = true }
frame-system-rpc-runtime-api = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
frame-system-benchmarking = { workspace = true, optional = true }

# pallets
pallet-aura = { workspace = true }
pallet-grandpa = { workspace = true }
pallet-timestamp = { workspace = true }
pallet-balances = { workspace = true }
pallet-transaction-payment = { workspace = true }
pallet-transaction-payment-rpc-runtime-api = { workspace = true }
pallet-sudo = { workspace = true }
pallet-utility = { workspace = true }
pallet-multisig = { workspace = true }
pallet-treasury = { workspace = true }
pallet-session = { workspace = true }
pallet-authorship = { workspace = true }
pallet-staking = { workspace = true }
pallet-offences = { workspace = true }
pallet-bags-list = { workspace = true }
pallet-election-provider-multi-phase = { workspace = true }
frame-election-provider-support = { workspace = true }
sp-npos-elections = { workspace = true }
pallet-contracts = { workspace = true }

# primitives
sp-api = { workspace = true }
sp-block-builder = { workspace = true }
sp-consensus-aura = { workspace = true }
sp-consensus-grandpa = { workspace = true }
sp-core = { workspace = true }
sp-inherents = { workspace = true }
sp-offchain = { workspace = true }
sp-runtime = { workspace = true }
sp-session = { workspace = true }
sp-staking = { workspace = true }
sp-std = { workspace = true }
sp-storage = { workspace = true }
sp-transaction-pool = { workspace = true }
sp-version = { workspace = true }
sp-genesis-builder = { workspace = true }
sp-io = { workspace = true }

[build-dependencies]
substrate-wasm-builder = { version = "29.0.0", optional = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "log/std",
    "serde_json/std",
    "elysium-primitives/std",
    "pallet-elysium-assets-registry/std",
    "pallet-liquidity-mining/std",
    "pallet-beta/std",
    "pallet-zk-verifier/std",
    "frame-support/std",
    "frame-system/std",
    "frame-executive/std",
    "frame-system-rpc-runtime-api/std",
    "pallet-aura/std",
    "pallet-grandpa/std",
    "pallet-timestamp/std",
    "pallet-balances/std",
    "pallet-transaction-payment/std",
    "pallet-transaction-payment-rpc-runtime-api/std",
    "pallet-sudo/std",
    "pallet-utility/std",
    "pallet-multisig/std",
    "pallet-treasury/std",
    "pallet-session/std",
    "pallet-authorship/std",
    "pallet-staking/std",
    "pallet-offences/std",
    "pallet-bags-list/std",
    "pallet-election-provider-multi-phase/std",
    "frame-election-provider-support/std",
    "sp-npos-elections/std",
    "pallet-contracts/std",
    "sp-api/std",
    "sp-block-builder/std",
    "sp-consensus-aura/std",
    "sp-consensus-grandpa/std",
    "sp-core/std",
    "sp-inherents/std",
    "sp-offchain/std",
    "sp-runtime/std",
    "sp-session/std",
    "sp-staking/std",
    "sp-std/std",
    "sp-storage/std",
    "sp-transaction-pool/std",
    "sp-version/std",
    "sp-genesis-builder/std",
    "sp-io/std",
    "frame-benchmarking?/std",
    "frame-system-benchmarking?/std",
    "frame-try-runtime?/std",
]
runtime-benchmarks = [
    "dep:frame-benchmarking",
    "dep:frame-system-benchmarking",
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "frame-system-benchmarking/runtime-benchmarks",
    "frame-election-provider-support/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
    "sp-staking/runtime-benchmarks",
    "pallet-grandpa/runtime-benchmarks",
    "pallet-timestamp/runtime-benchmarks",
    "pallet-balances/runtime-benchmarks",
    "pallet-sudo/runtime-benchmarks",
    "pallet-utility/runtime-benchmarks",
    "pallet-multisig/runtime-benchmarks",
    "pallet-treasury/runtime-benchmarks",
    "pallet-contracts/runtime-benchmarks",
    "pallet-session/runtime-benchmarks",
    "pallet-offences/runtime-benchmarks",
    "pallet-bags-list/runtime-benchmarks",
    "pallet-staking/runtime-benchmarks",
    "pallet-election-provider-multi-phase/runtime-benchmarks",
    "pallet-elysium-assets-registry/runtime-benchmarks",
    "pallet-liquidity-mining/runtime-benchmarks",
    "pallet-beta/runtime-benchmarks",
    "pallet-zk-verifier/runtime-benchmarks",
]
try-runtime = [
    "dep:frame-try-runtime",
    "frame-try-runtime/try-runtime",
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "frame-executive/try-runtime",
    "frame-election-provider-support/try-runtime",
    "sp-runtime/try-runtime",
    "pallet-aura/try-runtime",
    "pallet-grandpa/try-runtime",
    "pallet-timestamp/try-runtime",
    "pallet-balances/try-runtime",
    "pallet-transaction-payment/try-runtime",
    "pallet-sudo/try-runtime",
    "pallet-utility/try-runtime",
    "pallet-multisig/try-runtime",
    "pallet-treasury/try-runtime",
    "pallet-contracts/try-runtime",
    "pallet-session/try-runtime",
    "pallet-authorship/try-runtime",
    "pallet-offences/try-runtime",
    "pallet-bags-list/try-runtime",
    "pallet-staking/try-runtime",
    "pallet-election-provider-multi-phase/try-runtime",
    "pallet-elysium-assets-registry/try-runtime",
    "pallet-liquidity-mining/try-runtime",
    "pallet-beta/try-runtime",
    "pallet-zk-verifier/try-runtime",
]
